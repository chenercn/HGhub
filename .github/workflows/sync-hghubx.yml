name: Sync hghubx from HGhubX

on:
  workflow_dispatch:

permissions:
  contents: write
    workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hghubx
      - name: Merge HGhubX main into hghubx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add hghubx-remote https://github.com/zxsos/HGhubX.git
          git fetch hghubx-remote main
          git merge --no-ff -X theirs hghubx-remote/main -m "Merge zxsos/HGhubX main into hghubx"
          git push origin hghubx
          git log --oneline -3
